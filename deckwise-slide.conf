location ~ ^(/[0-9]+\.[0-9]+\.[0-9]+[.-][\w]+)?/sdkjs/slide/(?<deckwise_sdk>sdk-all(?:-min)?\.js)$ {
  add_header Cache-Control "no-cache" always;
  gzip_static on;
  alias /var/www/onlyoffice/deckwise-slide-sdk/$deckwise_sdk;
}

location ^~ /client/ {
  alias /var/www/onlyoffice/deckwise-client/;
  include /etc/nginx/includes/ds-mime.types.conf;
  types { application/javascript mjs; }
  add_header Cache-Control "no-cache" always;
}
